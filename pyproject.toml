[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wherewasi"
version = "0.1.0"
description = "Personal tool for repairing photo metadata (GPS inference, GPX tracks)"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
wherewasi = "wherewasi.cli:main"

[tool.setuptools]
packages = ["wherewasi"]
