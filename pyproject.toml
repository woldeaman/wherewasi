[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "photometa"
version = "0.1.0"
description = "Personal tool for repairing photo metadata (GPS inference, GPX tracks)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
photometa = "photometa.cli:main"

[tool.setuptools]
packages = ["photometa"]
